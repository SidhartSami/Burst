name: Build Linux Package

on:
  push:
    branches:
      - linux
  workflow_dispatch:

jobs:
  build:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements-linux.txt'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi \
            gir1.2-webkit2-4.0 \
            gir1.2-ayatanaappindicator3-0.1 \
            libgtk-3-dev \
            python3-pip \
            python3-libtorrent \
            libfuse2 \
            wget \
            file || sudo apt-get install -y gir1.2-webkit2-4.1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-linux.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed \
            --name Burst-Linux \
            --paths backend \
            --add-data "frontend/dist:frontend/dist" \
            --add-data "assets:assets" \
            --add-data "complete.wav:." \
            --hidden-import uvicorn \
            --hidden-import uvicorn.logging \
            --hidden-import uvicorn.loops \
            --hidden-import uvicorn.protocols \
            --hidden-import uvicorn.lifespans \
            --hidden-import fastapi \
            --hidden-import pystray \
            --hidden-import PIL \
            --hidden-import pygame \
            --hidden-import pyperclip \
            --hidden-import apscheduler \
            --hidden-import tzlocal \
            launch_linux.py

      - name: Package as AppImage using appimagetool
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp dist/Burst-Linux AppDir/usr/bin/Burst-Linux
          chmod +x AppDir/usr/bin/Burst-Linux

          # Desktop entry
          cat << 'EOF' > AppDir/burst.desktop
          [Desktop Entry]
          Name=Burst
          Comment=Burst High-Speed Download Manager
          Exec=Burst-Linux
          Icon=burst
          Type=Application
          Categories=Network;FileTransfer;
          Terminal=false
          EOF

          # Application icons
          cp assets/logo.png AppDir/burst.png
          cp assets/logo.png AppDir/.DirIcon
          cp assets/logo.png AppDir/usr/share/icons/hicolor/256x256/apps/burst.png

          # AppRun entry script
          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          exec "${HERE}/usr/bin/Burst-Linux" "$@"
          EOF
          chmod +x AppDir/AppRun

          # Download and execute appimagetool
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir Burst-Linux.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Burst-Linux.AppImage
          path: Burst-Linux.AppImage
